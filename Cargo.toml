[package]
name = "cuty-ssh"
version = "0.8.0"
edition = "2024"
description = "Fast, native Windows SSH2, SFTP, Telnet, Raw TCP & ConPTY connection manager built in pure Rust (egui)."
license = "MIT"
repository = "https://github.com/laurentvv/cuty-ssh"
homepage = "https://github.com/laurentvv/cuty-ssh"
readme = "README.md"
keywords = ["ssh", "sftp", "terminal", "egui", "sysadmin"]
categories = ["command-line-utilities", "gui", "network-programming"]

[dependencies]
aes = "0.9.3"
anyhow = "1.0.104"
arboard = "3.7.0"
argon2 = "0.6.0"
base64 = "0.23.1"
cbc = "0.2.1"
chrono = "0.4.45"
eframe = "0.37.0"
egui = "0.37.0"
egui_extras = { version = "0.37.0", features = ["all_loaders"] }
hex = "0.4.3"
hmac = "0.13.0"
image = { version = "0.25", default-features = false, features = ["png"] }
open = "5.4.4"
portable-pty = "0.9.0"
rfd = "0.17.2"
russh = { version = "0.64.1", default-features = false, features = ["ring", "flate2", "rsa", "dsa"] }
russh-sftp = "3.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
vte = "0.15.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Console"] }
winreg = "0.56.0"
zeroize = "1.9"

[target.'cfg(windows)'.dependencies]
# Pageant agent transport diagnostics (is_pageant_running) — same crate russh uses.
pageant = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true



[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
